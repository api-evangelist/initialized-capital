aid: initialized-capital
name: Initialized Capital
description: >-
  Initialized Capital is a seed-stage venture capital firm founded in 2012 by Garry Tan, Alexis Ohanian,
  and Harjeet (Harj) Taggar, with offices in San Francisco and New York. The firm is hyper-focused on the
  seed stage, typically investing before a startup's success strikes other investors as inevitable and
  favoring companies that have raised little to no prior capital. Rather than thematic investing,
  Initialized centers its thesis on strong founding teams and acts as a de facto extended founding team
  from 0 to 1, providing operational support across product design, engineering, recruiting, storytelling,
  go-to-market, and Series A fundraising. It invests broadly across enterprise SaaS, consumer, marketplaces,
  fintech, crypto, healthcare, climate, hardware, real estate, and frontier/AI technology. As of 2021 the
  firm had raised more than $3.2B across its funds and has backed 200+ companies, including 28 unicorns such
  as Coinbase, Instacart, Cruise, Flexport, Reddit, Opendoor, Rippling, and Patreon, with portfolio
  companies creating an aggregate of over $200B in market value.
